# ============================================================
# 多语言文案 - 简体中文（默认文件，兼最终兜底）
# 1. key = 简体中文原文（带参为中文模板，占位符 {0} {1}）
# 2. key 必须与代码字面量逐字一致，禁止手工重打
# 3. 新增语言：复制本文件为 messages_<语言码>.properties 并翻译 value
# 4. key 允许中文标点（，：。），禁止 ASCII 冒号、等号、反斜杠等 properties 保留字符
# 5. 唯一例外：邮件模板（mail.* 段）属长文模板，正文无法做 key，统一用 mail.* 短 key
# ============================================================

